<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerenciar caça-palavras | Jornada Paiter-Suruí</title><link rel="stylesheet" href="css/style.css"><style>main{max-width:900px;margin:25px auto;padding:16px}.card{background:#fffaf1;border:1px solid #decbb4;border-radius:12px;padding:20px;margin:14px 0}.item{padding:12px;border-bottom:1px solid #ddd}.item button{margin-left:12px}input,textarea{display:block;width:100%;padding:10px;margin:8px 0 14px;border:1px solid #bcae9c;border-radius:6px}textarea{min-height:130px}button{cursor:pointer;padding:9px 12px;border-radius:6px;border:1px solid #8a421f;background:#a54c26;color:white}#grade{display:grid;gap:3px;overflow-x:auto;max-width:100%}#grade button{padding:0;aspect-ratio:1;background:#fff;color:#252018;border:1px solid #a99b85;font-size:13px}#grade button.selecionado{background:#f6c487}#grade button.encontrada{background:#a7d6a8}.palavra{display:inline-block;margin:4px 9px 4px 0;padding:5px 8px;background:#eee4d4;border-radius:7px}.palavra.feito{background:#b4d7af;text-decoration:line-through}.aviso{padding:12px;background:#fff2c9;border-radius:8px}</style></head><body><header class="cabecalho"><div class="logo">PAITER-SURUÍ</div><nav class="menu"><a href="inicio.html">Início</a><a href="aprender.html">Aprender</a><a href="jogar.html">Quiz</a><a href="admin.html">Painel administrativo</a></nav></header><main id="area-administrativa" hidden><h1>Gerenciar caça-palavras</h1><p class="aviso">Etapa de laboratório: as atividades são salvas apenas neste navegador. Ainda não estão disponíveis para outros dispositivos.</p><section class="card"><h2>Cadastrar ou editar</h2><form id="form"><input id="id" type="hidden"><label for="titulo">Título</label><input id="titulo" required maxlength="120"><label for="palavras">Palavras, uma por linha</label><textarea id="palavras" required placeholder="TERRITORIO&#10;FLORESTA"></textarea><button type="submit">Salvar atividade</button></form><p id="status" role="status"></p></section><section class="card"><h2>Atividades cadastradas</h2><div id="cadastrados"></div></section></main><script src="js/caca-lab.js"></script><script src="js/supabase-config.js"></script><script src="js/proteger-admin.js"></script></body></html>
